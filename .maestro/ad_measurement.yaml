# Android: Profile > Ad measurement after a "Don't allow" sign-up: Off → Allow →
# On → Don't allow → Off. iOS asks in the system prompt, so Profile has no row.
appId: com.driveusa.app
---
- tapOn: "Profile"
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "(?s).*Ad measurement.*"
          direction: DOWN
      - assertVisible: "(?s).*Ad measurement.*Off.*"
      - tapOn: "(?s).*Ad measurement.*"
      - extendedWaitUntil:
          visible: "Allow ad measurement."
          timeout: 5000
      - tapOn: "Allow"
      - extendedWaitUntil:
          visible: "(?s).*Ad measurement.*On.*"
          timeout: 5000
      - tapOn: "(?s).*Ad measurement.*"
      - extendedWaitUntil:
          visible: "Allow ad measurement."
          timeout: 5000
      - tapOn: "Don't allow"
      - extendedWaitUntil:
          visible: "(?s).*Ad measurement.*Off.*"
          timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: "(?s).*Log out.*"
          direction: DOWN
      - assertNotVisible: "(?s).*Ad measurement.*"
