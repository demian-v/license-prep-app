# Regression: finish an exam, leave the result with the system Back button,
# start another. It must open on question 1, not on an empty result.
appId: com.driveusa.app
---
- tapOn: "Tests"
- tapOn: "Take Exam.*"
# iOS on the emulators only: the first read after a quiet minute can take 90 s.
# The emulator drops Firestore's 30 s keep-alive pings (too_many_pings).
- extendedWaitUntil:
    visible: "Question 1 of 40"
    timeout: 120000
- repeat:
    times: 40
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Exam (not )?passed"
    timeout: 20000
- runFlow: subflows/back.yaml
- tapOn: "Take Exam.*"
# iOS on the emulators only: the first read after a quiet minute can take 90 s.
# The emulator drops Firestore's 30 s keep-alive pings (too_many_pings).
- extendedWaitUntil:
    visible: "Question 1 of 40"
    timeout: 120000
- assertNotVisible: "Exam (not )?passed"
# The exam asks before leaving, so the iOS edge swipe does nothing here: tap
# the bar's close button, which has no label.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "10%,10%"
- tapOn: "Exit"
