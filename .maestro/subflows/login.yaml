# Fresh app state → signed in. Env: EMAIL, PASSWORD
appId: com.driveusa.app
---
- clearState
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp
# iOS: the sign-in lives in the Keychain, which survives a reinstall.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
      - launchApp:
          permissions:
            usertracking: deny
- extendedWaitUntil:
    visible: "Log In"
    timeout: 30000
- tapOn: "Email"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
# "Log In" is both the card title and the button.
- tapOn:
    text: "Log In"
    index: 1
