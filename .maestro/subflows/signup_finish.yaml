# Code screen → language → state → 7-step tour → tracking question → Home.
# Env: CODE (6 digits), TRACKING (the button: "Allow" or "Don't allow", on iOS
# "Allow" or "Ask App Not to Track")
appId: com.driveusa.app
---
# On iOS XCTest types faster than focus moves between the six boxes, so the
# digits go one by one, as a person types them.
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${CODE}
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: ${CODE.charAt(0)}
      - inputText: ${CODE.charAt(1)}
      - inputText: ${CODE.charAt(2)}
      - inputText: ${CODE.charAt(3)}
      - inputText: ${CODE.charAt(4)}
      - inputText: ${CODE.charAt(5)}
- extendedWaitUntil:
    visible: "Select your language"
    timeout: 45000
- tapOn: "English"
- extendedWaitUntil:
    visible: "Select your state"
    timeout: 30000
- tapOn: "(?s)California.*"
- tapOn: "Continue"
# Tour: 7 steps with instructors off. Step 1 "Let’s go", steps 2-6 an
# arrow labelled "Next", step 7 "Start".
- extendedWaitUntil:
    visible: "Welcome to DriveUSA"
    timeout: 45000
- tapOn: "(?s)Let.s go.*"
- repeat:
    times: 5
    commands:
      - tapOn: "Next"
      - waitForAnimationToEnd
- assertVisible: "(?s)Start.*"
- tapOn: "(?s)Start.*"
# Android asks in the app, and back must not dismiss it. iOS asks in a system
# prompt, whose buttons differ: run-signup.sh passes the iOS one in TRACKING.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Allow ad measurement."
          timeout: 10000
      - back
      - assertVisible: "Allow ad measurement."
      - tapOn: ${TRACKING}
      - assertNotVisible: "Allow ad measurement."
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*to track your activity.*"
          timeout: 10000
      - tapOn: ${TRACKING}
      - assertNotVisible: ".*to track your activity.*"
# Three tabs, no Instructors.
- assertVisible: "Tests"
- assertVisible: "Theory"
- assertVisible: "Profile"
- assertNotVisible: "Instructors"
