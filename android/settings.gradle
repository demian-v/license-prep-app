pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.0" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.1" apply false
    // Crashlytics (added 2026-09-17). Needed for the Gradle task that uploads
    // native symbols and the mapping file; without it Android crashes still
    // report, but release stack traces are obfuscated by R8 (see #31).
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    // stripe_android 14.x (instructors P9) puts the Compose compiler plugin
    // for Kotlin 2.4.10 on its own classpath, while this root pins Kotlin
    // 2.1.0, so its module failed with "Multiple values are not allowed for
    // plugin option ...compose...:sourceInformation". Pinned here, the root's
    // copy wins and matches the compiler (stripe_android 13.x used 2.1.0).
    // Moving Kotlin to 2.2+ instead would break the plugins that still use
    // `kotlinOptions` (an error since Kotlin 2.2).
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.0" apply false
}

include ":app"
