plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Add the line that's directly from the error message
android.buildFeatures.buildConfig = true

// Release signing inputs (risk #31). Loaded at the top level, not inside
// `android { }`, so the guard at the bottom of this file can see them too.
// key.properties is gitignored — it holds keystore passwords — so it is absent
// on every fresh clone and on CI. That is correct; the missing guard was the bug.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.driveusa.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
    // Java 17 required by in_app_purchase_android 0.5.0 (Play Billing 8.0.0),
    // which compiles at 17. Leaving the app module on 11 fails the build with
    // "class file has wrong version 61.0, should be 55.0".
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = '17'
}

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.driveusa.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // W7 / 2026-09-19. This line used to read `minSdkVersion 23`, and the file
        // was lying: the Flutter tool REWRITES it to `flutter.minSdkVersion` on
        // every build (it logs "Upgrading build.gradle"), and that constant is 24
        // in Flutter 3.41.7 (FlutterExtension.kt:26). Measured, not inferred — the
        // merged release manifest declares minSdkVersion="24".
        // Left as the symbol deliberately: a literal here is silently overwritten,
        // so a literal can only ever go stale again.
        minSdkVersion flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Firebase Analytics (required for DebugView)
    implementation 'com.google.firebase:firebase-analytics:21.5.0'
    // Firebase Core
    implementation 'com.google.firebase:firebase-core:21.1.1'
    // Firebase Auth
    implementation 'com.google.firebase:firebase-auth:22.3.1'
    // Cloud Firestore
    implementation 'com.google.firebase:firebase-firestore:24.10.0'
    // Cloud Functions
    implementation 'com.google.firebase:firebase-functions:20.4.0'
}

flutter {
    source = "../.."
}

// ---------------------------------------------------------------------------
// Risk #31 — release signing had no guard.
//
// `signingConfigs.release` is built from key.properties, and that file is
// gitignored. When it is absent every field becomes null, and reproduced on
// Windows 2026-09-19 the result was NOT a silently unsigned bundle (the
// register's worst case, which does not happen) but something almost as
// unhelpful: a full 135-second release build ending in
//
//     Execution failed for task ':app:signReleaseBundle'
//     > java.lang.NullPointerException (no error message)
//
// Nothing in that names the keystore. The fix is not to make the build fail —
// it already fails — but to make it fail in about a second, saying why.
//
// Deferred to the task graph on purpose. This file is configured on EVERY
// Gradle invocation, so throwing at configuration time would break debug
// builds, `flutter run` and `gradlew tasks` on any machine without the
// keystore — which is most of them, and all of CI.
// ---------------------------------------------------------------------------
def requiredKeystoreKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']

gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { t ->
        t.project == project && t.name ==~ /(?i)(assemble|bundle)Release.*/
    }
    if (!buildingRelease) {
        return
    }

    if (!keystorePropertiesFile.exists()) {
        throw new GradleException(
            "Release signing is not configured.\n\n" +
            "  android/key.properties is missing, so this release build cannot be signed\n" +
            "  with the upload key and must not be shipped.\n\n" +
            "  Create android/key.properties (see android/key.properties.example) with:\n" +
            "      " + requiredKeystoreKeys.join(', ') + "\n\n" +
            "  Debug builds and `flutter run` do not need it."
        )
    }

    def missing = requiredKeystoreKeys.findAll { !keystoreProperties[it] }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "Release signing is incomplete: android/key.properties is missing " +
            missing.join(', ') + "."
        )
    }

    def resolvedStore = file(keystoreProperties['storeFile'])
    if (!resolvedStore.exists()) {
        throw new GradleException(
            "Release signing is misconfigured: keystore not found at\n" +
            "      " + resolvedStore.absolutePath + "\n" +
            "  (storeFile in android/key.properties)."
        )
    }
}
